name: Kafka Integration

# 阶段七：Kafka 端到端集成测试。
#
# 之所以不放进主 ci.yml 的必过门槛，是因为单节点 KRaft 在 CI 上启动与分区选举
# 容易抖动，把它做成手动触发（workflow_dispatch）能避免噪音。需要时在仓库页面的
# Actions 里点「Run workflow」即可，或本地用 `make test-kafka-integration`。
on:
  workflow_dispatch:

jobs:
  kafka-integration:
    name: Kafka + MySQL integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tiny_blog
          MYSQL_USER: blog
          MYSQL_PASSWORD: change-me
        ports:
          - "3306:3306"
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
          --health-start-period 60s
      kafka:
        image: apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_NUM_PARTITIONS: 3
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - "9092:9092"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run migrations
        run: |
          go install -tags 'mysql' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          "$(go env GOPATH)/bin/migrate" \
            -path backend/migrations \
            -database "mysql://blog:change-me@tcp(127.0.0.1:3306)/tiny_blog?multiStatements=true" \
            up

      # 同时注入 MySQL 与 Kafka 地址，跑 view 包的幂等落库 + 端到端往返测试。
      - name: Run Kafka integration tests
        env:
          MYSQL_TEST_DSN: "blog:change-me@tcp(127.0.0.1:3306)/tiny_blog?charset=utf8mb4&parseTime=true&loc=UTC"
          KAFKA_TEST_ADDR: "127.0.0.1:9092"
        run: |
          cd backend
          go test -tags=integration ./internal/view -v

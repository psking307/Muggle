app:
  env: development
  name: Muggle

log:
  level: debug

http:
  addr: ":8080"
  read_header_timeout: 5s
  read_timeout: 10s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 10s

mysql:
  host: "127.0.0.1"
  # 与 deploy/compose.yaml 映射的宿主机端口保持一致（MySQL 标准端口）。
  port: 3306
  database: tiny_blog
  user: blog
  # 密码只能由 MYSQL_PASSWORD 环境变量提供，不能提交到仓库。
  password: ""
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m

# 阶段五：公开文章缓存。Redis 只保存可删除、可重建的缓存，不是业务事实来源，
# 因此即使清空或不可用，公开文章也能回源 MySQL 正常读取。
redis:
  # 开发环境指向本机映射端口；完整 Compose 环境里改用服务名 redis:6379。
  addr: "127.0.0.1:6379"
  # 密码默认为空（本地开发不设密码）；生产环境可用 REDIS_PASSWORD 覆盖。
  password: ""
  db: 0
  # 各超时取短值，保证 Redis 故障时请求能快速降级回源 MySQL。
  dial_timeout: 1s
  read_timeout: 500ms
  write_timeout: 500ms

auth:
  # 签发与验证 Access JWT 的 HMAC 密钥。
  # 只能由 JWT_SECRET 环境变量提供；本地可用 `openssl rand -hex 32` 生成。
  jwt_secret: ""
  access_token_ttl: 15m
  refresh_session_ttl: 168h
  refresh_cookie_name: muggle_refresh
  # 本地开发走 HTTP，不启用 Secure；生产环境由配置校验强制开启。
  refresh_cookie_secure: false
  refresh_cookie_same_site: lax
  public_origin: "http://localhost:5173"

basePath: /api/v1
definitions:
  admin.AdminSummary:
    properties:
      id:
        type: integer
      username:
        type: string
    type: object
  admin.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  admin.MeDataResponse:
    properties:
      data:
        $ref: '#/definitions/admin.AdminSummary'
    type: object
  admin.SessionDataResponse:
    properties:
      data:
        $ref: '#/definitions/admin.SessionResponse'
    type: object
  admin.SessionResponse:
    properties:
      access_token:
        description: AccessToken 只进入前端内存（Zustand），不写入 LocalStorage。
        type: string
      admin:
        $ref: '#/definitions/admin.AdminSummary'
    type: object
  httpapi.LiveResponse:
    properties:
      status:
        type: string
    type: object
  httpapi.ReadyChecks:
    properties:
      mysql:
        type: string
    type: object
  httpapi.ReadyResponse:
    properties:
      checks:
        $ref: '#/definitions/httpapi.ReadyChecks'
      status:
        type: string
    type: object
  post.DetailResponse:
    properties:
      data:
        $ref: '#/definitions/post.PublicDetail'
    type: object
  post.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/post.PublicListItem'
        type: array
      meta:
        $ref: '#/definitions/post.PageMeta'
    type: object
  post.PageMeta:
    properties:
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  post.PublicDetail:
    properties:
      content_md:
        type: string
      id:
        type: integer
      published_at:
        type: string
      slug:
        type: string
      summary:
        type: string
      title:
        type: string
    type: object
  post.PublicListItem:
    properties:
      id:
        type: integer
      published_at:
        type: string
      slug:
        type: string
      summary:
        type: string
      title:
        type: string
    type: object
  response.APIError:
    properties:
      code:
        type: string
      message:
        type: string
      request_id:
        type: string
    type: object
  response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/response.APIError'
    type: object
info:
  contact: {}
  description: Muggle Tiny Blog 阶段三 API：公开文章读取 + 管理员认证与会话。
  title: Muggle API
  version: 0.3.0
paths:
  /admin/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.MeDataResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取当前管理员摘要
      tags:
      - admin-auth
  /admin/session:
    delete:
      description: 撤销当前 Refresh Session 并清除 Refresh Cookie。
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 退出登录
      tags:
      - admin-auth
    post:
      consumes:
      - application/json
      description: 验证用户名密码，返回 Access Token 并设置 HttpOnly Refresh Cookie。
      parameters:
      - description: 用户名和密码
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/admin.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.SessionDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 管理员登录
      tags:
      - admin-auth
  /admin/session/refresh:
    post:
      description: 用 HttpOnly Cookie 中的 Refresh Token 换取新的 Access Token 和 Refresh
        Cookie；旧 Token 立即失效。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/admin.SessionDataResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 轮转 Refresh Session
      tags:
      - admin-auth
  /health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.LiveResponse'
      summary: 检查 API 进程是否存活
      tags:
      - health
  /health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.ReadyResponse'
      summary: 检查 API 是否可以访问必要的 MySQL
      tags:
      - health
  /posts:
    get:
      parameters:
      - description: 页码，默认 1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页数量，默认 10
        in: query
        maximum: 100
        minimum: 1
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/post.ListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 获取公开文章列表
      tags:
      - public-posts
  /posts/{slug}:
    get:
      parameters:
      - description: 文章 slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/post.DetailResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      summary: 根据 slug 获取公开文章
      tags:
      - public-posts
securityDefinitions:
  BearerAuth:
    description: '管理接口使用 Bearer Access Token：Authorization: Bearer <token>'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"

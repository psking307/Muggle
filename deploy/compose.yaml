name: muggle

services:
  mysql:
    # 使用 MySQL 8 的长期支持版本，避免 latest 自动跨大版本升级。
    image: mysql:8.4
    profiles: ["dev", "tools"]
    environment:
      # root 账号只用于初始化和运维；API 使用下面权限更小的 blog 账号。
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      # 项目统一保存 UTC 时间，展示时再由前端转成本地时间。
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      # 只允许本机访问，不把数据库端口暴露到局域网。
      - target: 3306
        # 宿主机端口与容器端口一致，使用 MySQL 标准端口 3306。
        published: "3306"
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      # 容器删除或重建后，数据库文件仍保存在 named volume 中。
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 双美元符号表示变量由容器内 Shell 展开，而不是由 Compose 提前展开。
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 3s
      # 第一次创建 named volume 时，MySQL 还要初始化系统表、创建数据库和业务账号。
      # 在资源较紧张的 Docker Desktop/WSL 环境里，这一步可能超过两分钟；
      # start_period 内的失败不会消耗重试次数，避免数据库即将就绪时被 Compose 误判失败。
      retries: 30
      start_period: 60s

  redis:
    # 公开文章缓存。Redis 只保存可删除、可重建的缓存数据，不挂持久卷，
    # 因此容器删除后数据丢失也无所谓——重新启动后由 API 回源 MySQL 重建。
    image: redis:7-alpine
    profiles: ["dev"]
    command: ["redis-server", "--appendonly", "no"]
    ports:
      # 只允许本机访问，不把缓存端口暴露到局域网。
      - target: 6379
        # 宿主机端口与容器端口一致，使用 Redis 标准端口 6379。
        published: "6379"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      # 用 redis-cli ping 探测：Redis 正常时返回 PONG。
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    # 单节点 KRaft broker（broker 与 controller 合一，无需 Zookeeper）。
    # Kafka 承载“尽力而为”的浏览事件，不是业务事实来源：broker 不可用时
    # 文章读取不受影响，只会少算浏览量（设计文档 7.2）。
    image: apache/kafka:3.9.1
    profiles: ["dev"]
    ports:
      # 只允许本机访问。宿主机（WSL）上的 API/Worker 通过 127.0.0.1:9092 连接。
      - target: 9092
        published: "9092"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      # KRaft 模式：单个节点同时承担 broker 与 controller 角色。
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 容器内监听：9092 给客户端，9093 给控制器内部通信。
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 对外宣告地址必须用 127.0.0.1（而非 localhost），否则客户端可能解析到 IPv6
      # 而无法连接；这是宿主机直连模式下最容易踩的坑。
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # KRaft quorum：单节点用 1@localhost:9093（broker 自己解析 localhost）。
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 单节点集群下这些内部主题都只需 1 个副本，否则 broker 无法完成元数据写入。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 安全网：若某主题被 broker 自动创建，默认 3 个分区（与设计文档一致）。
      KAFKA_NUM_PARTITIONS: 3
      # 单消费者时立刻触发 rebalance，避免等待首个消费组重建。
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      # 保存 Kafka 日志与元数据；容器重建后消息仍可恢复。
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      # 用内置脚本探测 broker API 是否可访问，失败即认为未就绪。
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  migrate:
    # 迁移工具只在 make migrate-* 时临时运行，不会常驻。
    image: migrate/migrate:v4.19.1
    profiles: ["tools"]
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # 迁移 SQL 以只读方式挂进工具容器，防止工具意外修改源码。
      - ../backend/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database
      - mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?multiStatements=true

volumes:
  # Compose 管理的持久化 MySQL 数据卷。
  mysql_data:
  # Kafka 日志与元数据卷（阶段六新增）。
  kafka_data:
